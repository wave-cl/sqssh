name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # Twelve crates plus a git dependency that builds ring from source.
      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # Nothing in the unit tests opens a connection, so they pass whether or
      # not sqssh and sqsshd can talk. This drives the real binaries: one case
      # proves a handshake completes, the other proves an empty whitelist still
      # drops silently. See the header of the script for why the second is what
      # makes the first mean anything.
      - name: Transport smoke test
        run: bash scripts/transport_smoke.sh
